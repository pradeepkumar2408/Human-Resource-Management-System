# Server Configuration
server.port=8116

# Spring Datasource Configuration (Oracle DB Connection)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=df_payroll
spring.datasource.password=PayrollPass123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# Set to 'none' since the schema is created manually using SQL DDL script (db_setup.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
