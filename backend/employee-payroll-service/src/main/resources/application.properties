# ===================================================================
# Employee Payroll Service Configuration (Port 8085)
# ===================================================================
server.port=8085
spring.application.name=employee-payroll-service

# Oracle Database Connection (Dedicated PDB User: dayflow_payroll)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/orcl
spring.datasource.username=dayflow_payroll
spring.datasource.password=payroll_password123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Spring Data JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.dayflow.payroll=DEBUG
logging.level.org.hibernate.SQL=DEBUG
