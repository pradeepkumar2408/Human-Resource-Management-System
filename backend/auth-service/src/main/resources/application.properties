# ===================================================================
# Auth-Service Configuration (Dayflow HRMS)
# ===================================================================
server.port=8081
spring.application.name=auth-service

# ===================================================================
# Oracle 11g Database Connection (Port 1522)
# ===================================================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1522:xe
spring.datasource.username=dayflow_auth
spring.datasource.password=auth_password123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# Spring Data JPA / Hibernate Settings for Oracle 11g
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.dayflow.auth=DEBUG
logging.level.org.hibernate.SQL=DEBUG
