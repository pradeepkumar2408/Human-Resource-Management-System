# ===================================================================
# Employee Profile Service Configuration (Port 8082)
# ===================================================================
server.port=8082
spring.application.name=employee-profile-service

# Oracle 11g Database Connection (Dedicated PDB DB User: dayflow_employee)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/orcl
spring.datasource.username=dayflow_employee
spring.datasource.password=employee_password123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Spring Data JPA / Hibernate Settings for Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.dayflow.employee=DEBUG
logging.level.org.hibernate.SQL=DEBUG
